<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1F5C3A">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Mes dépenses</title>
<style>
  :root{
    --vert:#1F5C3A; --vert2:#2E7D50; --vertc:#E8F2EC;
    --rouge:#C0392B; --bleu:#2C5E8C; --orange:#B9770E; --orangec:#FDF2E0;
    --fond:#F4F6F4; --carte:#FFFFFF; --texte:#1D241F; --gris:#6B746E; --trait:#DDE3DE;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:var(--fond);color:var(--texte);
    font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:16px}
  button{font-family:inherit;cursor:pointer}
  .haut{background:var(--vert);color:#fff;padding:calc(14px + env(safe-area-inset-top)) 16px 40px}
  .haut .t{font-size:14px;opacity:.85}
  .haut .total{font-size:32px;font-weight:700;margin-top:2px;letter-spacing:-.5px}
  .haut .sous{font-size:14px;opacity:.92;margin-top:6px;line-height:1.5}
  .ret{color:var(--rouge);font-weight:700}
  .haut .ligne{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
  .rond{background:rgba(255,255,255,.15);border:0;color:#fff;border-radius:50%;width:40px;height:40px;font-size:19px;flex:none}
  .etat{display:inline-flex;align-items:center;gap:6px;margin-top:10px;background:rgba(255,255,255,.14);border:0;color:#fff;border-radius:20px;padding:6px 12px;font-size:13px}
  .etat i{width:9px;height:9px;border-radius:50%;background:#7CDB9E;display:inline-block}
  .etat.attente i{background:#F5C451} .etat.horsligne i{background:#C9CFCA} .etat.erreur i{background:#FF8A7A}
  main{padding:0 16px 100px;max-width:560px;margin:0 auto}
  h2{font-size:14px;color:var(--gris);font-weight:600;margin:22px 2px 8px;text-transform:uppercase;letter-spacing:.4px}
  .actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:-26px}
  .act{border:0;border-radius:16px;padding:14px 4px;font-size:14px;font-weight:700;color:#fff;
    box-shadow:0 3px 10px rgba(0,0,0,.12);display:flex;flex-direction:column;align-items:center;gap:4px}
  .act .ic{font-size:26px;line-height:1}
  .act.reg{background:#6B4E9B} .act.enc{background:#1F7A6B} .act.aut{background:#fff;color:var(--texte);border:1px solid var(--trait);box-shadow:none} .act.dep{background:var(--rouge)} .act.rec{background:var(--vert2)} .act.tra{background:var(--bleu)}
  .lien-l{cursor:pointer}
  .actions.grand{grid-template-columns:1fr 1fr} .actions.grand .act{padding:20px 4px;font-size:18px} .actions.grand .ic{font-size:32px}
  .actions.petit{grid-template-columns:repeat(4,1fr);margin-top:8px} .actions.petit .act{padding:11px 2px;font-size:13px;flex-direction:row;justify-content:center}
  .quand{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .quand button{border:2px solid var(--trait);background:#fff;border-radius:14px;padding:14px 6px;font-size:15px;font-weight:700;color:var(--texte)}
  .quand button.on{border-color:var(--vert);background:var(--vertc);color:var(--vert)}
  .autre{display:block;margin:10px auto 0;background:none;border:0;color:var(--gris);font-size:14px;text-decoration:underline}
  .caisses{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .caisse{background:var(--carte);border-radius:14px;padding:12px;border:1px solid var(--trait);text-align:left;color:var(--texte)}
  .caisse .n{font-size:14px;color:var(--gris)} .caisse .s{font-size:19px;font-weight:700;margin-top:4px}
  .neg{color:var(--rouge)!important}
  .tab{background:var(--carte);border-radius:14px;border:1px solid var(--trait);overflow:hidden}
  .tab .r{display:grid;grid-template-columns:1.3fr 1fr 1fr 1fr;padding:10px 12px;border-top:1px solid var(--trait);font-size:14px}
  .tab .r:first-child{border-top:0;background:var(--vertc);font-weight:600;color:var(--vert)}
  .tab .r span:not(:first-child){text-align:right}
  .vide{color:var(--gris);text-align:center;padding:18px;font-size:14px}
  .note{font-size:12px;color:var(--gris);margin:8px 2px 0}
  nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--trait);display:flex;z-index:5;padding-bottom:env(safe-area-inset-bottom)}
  nav button{flex:1;background:none;border:0;padding:12px 0 14px;font-size:13px;color:var(--gris)}
  nav button .i{display:block;font-size:22px}
  nav button.on{color:var(--vert);font-weight:700}
  .filtres{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px}
  .chip{flex:none;border:1px solid var(--trait);background:#fff;border-radius:20px;padding:8px 14px;font-size:14px;color:var(--texte)}
  .chip.on{background:var(--vert);border-color:var(--vert);color:#fff}
  .op{background:var(--carte);border:1px solid var(--trait);border-radius:12px;padding:12px;margin-bottom:8px;display:flex;justify-content:space-between;gap:10px;width:100%;text-align:left;color:var(--texte)}
  .op.att{border-style:dashed;border-color:#E2B85C;background:#FFFCF4}
  .op.err{border-color:var(--rouge);background:#FDF0EE}
  .op .l1{font-weight:600;font-size:15px} .op .l2{font-size:13px;color:var(--gris);margin-top:3px}
  .op .l3{font-size:12px;margin-top:4px;font-weight:600}
  .op.att .l3{color:var(--orange)} .op.err .l3{color:var(--rouge)}
  .op .m{font-weight:700;white-space:nowrap;font-size:16px}
  .m.dep{color:var(--rouge)} .m.rec{color:var(--vert2)} .m.tra{color:var(--bleu)}
  .ecran{position:fixed;inset:0;background:var(--fond);z-index:10;overflow-y:auto;display:none}
  .ecran.on{display:block}
  .ecran .barre{position:sticky;top:0;color:#fff;padding:calc(12px + env(safe-area-inset-top)) 16px 12px;display:flex;align-items:center;gap:12px;font-size:18px;font-weight:700;z-index:2;background:var(--vert)}
  .ecran .barre button{background:rgba(255,255,255,.18);border:0;color:#fff;width:38px;height:38px;border-radius:50%;font-size:20px;flex:none}
  .corps{padding:16px;max-width:560px;margin:0 auto 40px}
  .montant{width:100%;font-size:36px;font-weight:700;text-align:center;border:0;border-bottom:3px solid var(--trait);background:transparent;padding:10px 0;outline:none;color:var(--texte)}
  .montant:focus{border-color:var(--vert)}
  .unite{text-align:center;color:var(--gris);font-size:14px;margin-top:4px}
  label.lb{display:block;font-size:13px;color:var(--gris);font-weight:600;margin:18px 2px 8px;text-transform:uppercase;letter-spacing:.3px}
  .choix{display:flex;flex-wrap:wrap;gap:8px}
  select,input.ch{width:100%;font-size:16px;padding:13px 12px;border:1px solid var(--trait);border-radius:12px;background:#fff;color:var(--texte)}
  .deux{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .valider{width:100%;margin-top:26px;border:0;border-radius:14px;padding:17px;font-size:18px;font-weight:700;color:#fff;background:var(--vert)}
  .valider:disabled{opacity:.5}
  .resume{margin-top:18px;background:#fff;border:1px dashed var(--trait);border-radius:12px;padding:12px;font-size:14px;color:var(--gris);line-height:1.5}
  .resume b{color:var(--texte)}
  .detail .ligne2{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--trait);font-size:15px;gap:12px}
  .detail .ligne2 span:first-child{color:var(--gris)}
  .detail .ligne2 span:last-child{text-align:right;font-weight:600;word-break:break-word}
  .bandeau{border-radius:12px;padding:12px;font-size:14px;margin-bottom:8px;line-height:1.45}
  .bandeau.att{background:var(--orangec);color:#7a4e06} .bandeau.err{background:#FDF0EE;color:var(--rouge)}
  .suppr{width:100%;margin-top:26px;border:1px solid var(--rouge);color:var(--rouge);background:#fff;border-radius:14px;padding:15px;font-size:16px;font-weight:700}
  .aide{font-size:14px;color:var(--gris);line-height:1.5}
  .toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#1D241F;color:#fff;padding:12px 18px;border-radius:24px;font-size:15px;z-index:40;display:none;max-width:90%;text-align:center}
  .toast.err{background:var(--rouge)}
  .navper{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px;background:#fff;border:1px solid var(--trait);border-radius:14px;padding:6px}
  .navper span{font-weight:700;font-size:17px;text-transform:capitalize}
  .navper button{border:0;background:var(--vertc);color:var(--vert);width:52px;height:44px;border-radius:10px;font-size:20px;font-weight:700}
  .bal .r{font-size:13px;padding:8px 8px;gap:4px}
  .bal .r span:not(:first-child){text-align:right;white-space:nowrap}
  .imp-titre{display:none}
  @media print{
    .haut,nav,.nonimp,.toast,#v-soldes h2{display:none!important}
    body{background:#fff} main{max-width:none;padding:0}
    .imp-titre{display:block;font-size:18px;font-weight:700;margin:0 0 8px}
    .bal{border:1px solid #999} .bal .r{font-size:11px;padding:4px 6px;break-inside:avoid}
  }
  .chip.plus{border-style:dashed;color:var(--vert);font-weight:600}
  .glf{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .glf label{font-size:12px;color:var(--gris);font-weight:600;display:block;margin:0 2px 4px}
  .glf select,.glf input{width:100%;font-size:15px;padding:10px;border:1px solid var(--trait);border-radius:10px;background:#fff;color:var(--texte)}
  .plus-btn{width:100%;margin-top:6px;border:1px solid var(--trait);background:#fff;border-radius:12px;padding:12px;font-size:15px;color:var(--vert);font-weight:600}
</style>
</head>
<body>

<div class="haut">
  <div class="ligne">
    <div>
      <div class="t" id="totalLib">Dépenses de l'année</div>
      <div class="total" id="total">—</div>
      <div class="sous" id="sousTotal"></div>
    </div>
    <button class="rond" onclick="ouvrirReglages()" aria-label="Réglages">⚙</button>
  </div>
  <button class="etat" id="etat" onclick="synchroniser(true)"><i></i><span id="etatTxt">…</span></button>
</div>

<main>
  <section id="v-accueil">
    <div class="actions grand">
      <button class="act dep" onclick="ouvrirForm('dep')"><span class="ic">−</span>Dépense</button>
      <button class="act rec" onclick="ouvrirForm('rec')"><span class="ic">+</span>Recette</button>
    </div>
    <div class="actions petit">
      <button class="act aut" onclick="ouvrirForm('reg')">✓ Payer</button>
      <button class="act aut" onclick="ouvrirForm('enc')">⬇ Encaisser</button>
      <button class="act aut" onclick="ouvrirForm('tra')">⇄ Transfert</button>
      <button class="act aut" onclick="ouvrirForm('aut')">≡ Autre</button>
    </div>

    <h2>À payer</h2>
    <div class="tab lien-l" id="resApayer" onclick="AMODE='payer';vue('apayer')"></div>

    <h2>Mes caisses et banques</h2>
    <div class="caisses" id="caisses"></div>

    <h2 id="titreMois">Ce mois-ci par domaine</h2>
    <div class="tab" id="mois"></div>
    <div class="note" id="noteMaj"></div>
  </section>

  <section id="v-lettrage" style="display:none"></section>
  <section id="v-soldes" style="display:none"></section>
  <section id="v-apayer" style="display:none"></section>

  <section id="v-histo" style="display:none">
    <h2>Grand livre</h2>
    <div id="glFiltres"></div>
    <div id="glTotaux" style="margin-top:12px"></div>
    <div class="note" id="glNote" style="margin:6px 2px 10px"></div>
    <div id="liste"></div>
  </section>
</main>

<nav>
  <button id="n-accueil" class="on" onclick="vue('accueil')"><span class="i">⌂</span>Accueil</button>
  <button id="n-apayer" onclick="vue('apayer')"><span class="i">⌛</span>À payer</button>
  <button id="n-histo" onclick="vue('histo')"><span class="i">☰</span>Grand livre</button>
  <button id="n-soldes" onclick="vue('soldes')"><span class="i">Σ</span>Balance</button>
  <button id="n-lettrage" onclick="vue('lettrage')"><span class="i">✓</span>Lettrage</button>
</nav>

<!-- Formulaire de saisie -->
<div class="ecran" id="form">
  <div class="barre" id="formBarre"><button onclick="fermer('form')">←</button><span id="formTitre">Dépense</span></div>
  <div class="corps">
    <input id="f-montant" class="montant" type="text" inputmode="decimal" placeholder="0" autocomplete="off">
    <div class="unite">MAD</div>
    <div id="bloc-quand" style="display:none"><label class="lb">Quand ?</label>
      <div class="quand"><button type="button" data-q="now" id="q-now">Maintenant</button><button type="button" data-q="tard" id="q-tard">Plus tard</button></div></div>
    <div id="bloc-caisse"><label class="lb" id="lb-caisse">Payé avec</label><div class="choix" id="c-caisse"></div></div>
    <div id="bloc-ech" style="display:none"><label class="lb" id="lb-ech">À payer le</label>
      <input id="f-ech" class="ch" type="date">
      <div class="choix" id="c-ech" style="margin-top:8px"></div></div>
    <div id="bloc-vers" style="display:none"><label class="lb">Vers la caisse</label><div class="choix" id="c-vers"></div></div>
    <div id="bloc-rub"><label class="lb" id="lb-rub">Rubrique</label><select id="f-rub"></select></div>
    <div id="bloc-tiers" style="display:none"><label class="lb" id="lb-tiers">Fournisseur</label><select id="f-tiers" class="ch"></select>
      <div class="note" id="note-tiers" style="margin-top:6px"></div></div>
    <div id="bloc-libre" style="display:none">
      <label class="lb">Compte DÉBIT (ce qui reçoit)</label><select id="f-deb"></select>
      <label class="lb">Compte CRÉDIT (ce qui donne)</label><select id="f-cre"></select>
    </div>
    <label class="lb">Domaine</label><div class="choix" id="c-act"></div>
    <div class="deux">
      <div><label class="lb">Date</label><input id="f-date" class="ch" type="date"></div>
      <div><label class="lb">N° pièce</label><input id="f-piece" class="ch" type="text" placeholder="auto"></div>
    </div>
    <label class="lb">Libellé</label>
    <input id="f-lib" class="ch" type="text" placeholder="ex : gasoil tracteur">
    <div class="resume" id="resume"></div>
    <button class="valider" id="btnValider" onclick="valider()">Enregistrer</button>
  </div>
</div>

<!-- Détail d'une opération -->
<div class="ecran" id="detail">
  <div class="barre"><button onclick="fermer('detail')">←</button><span>Détail de l'opération</span></div>
  <div class="corps detail" id="detailCorps"></div>
</div>

<!-- Réglages -->
<div class="ecran" id="reglages">
  <div class="barre"><button id="btnFermerReglages" onclick="fermer('reglages')">←</button><span>Connexion au Google Sheet</span></div>
  <div class="corps">
    <p class="aide">Collez l'adresse du script de votre Google Sheet (elle se termine par <b>/exec</b>) et le code secret que vous avez écrit dans le script.</p>
    <label class="lb">Adresse du script</label>
    <input id="r-url" class="ch" type="url" placeholder="https://script.google.com/macros/s/.../exec" autocomplete="off">
    <label class="lb">Code secret</label>
    <input id="r-cle" class="ch" type="password" autocomplete="off">
    <button class="valider" id="btnTester" onclick="testerConnexion()">Tester et enregistrer</button>
    <p class="aide" id="r-info" style="margin-top:18px"></p>
  </div>
</div>

<!-- Création d'un nouveau choix (tiers, caisse, centre, domaine) -->
<div class="ecran" id="nouveau" style="z-index:20">
  <div class="barre"><button onclick="annulerNouveau()">←</button><span id="nvTitre">Nouveau</span></div>
  <div class="corps">
    <label class="lb">Nom</label>
    <input id="nv-nom" class="ch" type="text" autocomplete="off">
    <div id="nv-bloc-grp"><label class="lb" id="nv-lb-grp">Groupe</label><div class="choix" id="nv-grp"></div>
      <input id="nv-grp-autre" class="ch" type="text" style="margin-top:8px;display:none" placeholder="Nom du nouveau groupe"></div>
    <p class="aide" id="nv-aide" style="margin-top:16px"></p>
    <button class="valider" onclick="validerNouveau()">Créer</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* =========================================================
   Stockage dans le téléphone
   ========================================================= */
var CLE_CFG='mc_cfg', CLE_CACHE='mc_donnees', CLE_FILE='mc_file', CLE_DERN='mc_derniere_caisse';
function lire(k, def){ try{ var v=localStorage.getItem(k); return v?JSON.parse(v):def; }catch(e){ return def; } }
function ecrire(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); return true; }catch(e){ toast('Mémoire du téléphone pleine : impossible d\'enregistrer.', true); return false; } }

var CFG   = lire(CLE_CFG, null);       // {url, cle}
var CACHE = lire(CLE_CACHE, null);     // dernières données reçues du Sheet
var FILE  = lire(CLE_FILE, []);        // opérations en attente d'envoi
var D = null;                          // données affichées (Sheet + attente)
var enCours=false, derniereErreur='', F={};

if (navigator.storage && navigator.storage.persist) { try{ navigator.storage.persist(); }catch(e){} }

/* =========================================================
   Format
   ========================================================= */
function mad(n){ return (Number(n)||0).toLocaleString('fr-FR',{minimumFractionDigits:0,maximumFractionDigits:2})+' MAD'; }
function fmtc(n){ return (Number(n)||0).toLocaleString('fr-FR',{maximumFractionDigits:0}); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function norm(s){ return String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/\s+/g,' ').trim(); }
function deux(n){ return String(n).padStart(2,'0'); }
function aujourdhui(){ var d=new Date(); return d.getFullYear()+'-'+deux(d.getMonth()+1)+'-'+deux(d.getDate()); }
function moisCourant(){ var d=new Date(); return d.getFullYear()+'-'+deux(d.getMonth()+1); }
function dateFr(s){ if(!s) return ''; var p=s.split('-'); return p[2]+'/'+p[1]+'/'+p[0]; }
function heure(iso){ if(!iso) return ''; var d=new Date(iso); return isNaN(d)?'':deux(d.getHours())+':'+deux(d.getMinutes()); }
function nouvelId(){ return (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : 'id-'+Date.now()+'-'+Math.random().toString(36).slice(2); }
function toast(msg, err){
  var t=document.getElementById('toast'); t.textContent=msg; t.className='toast'+(err?' err':''); t.style.display='block';
  clearTimeout(toast._t); toast._t=setTimeout(function(){t.style.display='none';}, err?5000:2200);
}

/* =========================================================
   Données affichées = dernier état du Sheet + opérations en attente
   ========================================================= */
function calculer(){
  if(!CACHE){ D=null; return; }
  var typeDe={}; comptesAvecAttente().forEach(function(c){ typeDe[c.nom]=c.type; });
  var soldes=Object.assign({}, CACHE.soldes||{}); CACHE.caisses.forEach(function(c){ soldes[c.nom]=c.solde; });
  var anCourant=String(new Date().getFullYear());
  var annee = String(CACHE.anneeCle||'')===anCourant ? Object.assign({}, CACHE.annee||{}) : {};
  var mc=moisCourant();
  var mois = CACHE.cleMois===mc ? JSON.parse(JSON.stringify(CACHE.mois||{})) : {};
  var recents = CACHE.recents.map(function(o){ var x=Object.assign({},o); x.typeDebit=typeDe[o.debit]||''; x.typeCredit=typeDe[o.credit]||''; return x; });

  function effet(e, signe){
    var m=Number(e.montant)*signe;
    soldes[e.debit]=(soldes[e.debit]||0)+m;
    soldes[e.credit]=(soldes[e.credit]||0)-m;
    if(String(e.date).slice(0,4)===anCourant){ annee[e.debit]=(annee[e.debit]||0)+m; annee[e.credit]=(annee[e.credit]||0)-m; }
    if(String(e.date).slice(0,7)===mc){
      var a=e.activite||'Sans activité'; if(!mois[a]) mois[a]={dep:0,rec:0};
      if(typeDe[e.debit]==='Charge') mois[a].dep+=m;
      if(typeDe[e.credit]==='Charge') mois[a].dep-=m;
      if(typeDe[e.credit]==='Produit') mois[a].rec+=m;
      if(typeDe[e.debit]==='Produit') mois[a].rec-=m;
    }
  }
  FILE.forEach(function(op){
    if(op.type==='ajout'){
      if(!op.erreur) effet(op.e, 1);
      recents.push(Object.assign({}, op.e, {id:op.id, attente:!op.erreur, erreur:op.erreur||'', typeDebit:typeDe[op.e.debit]||'', typeCredit:typeDe[op.e.credit]||''}));
    } else if(op.type==='groupe'){
      op.ecritures.forEach(function(e){
        if(!op.erreur) effet(e, 1);
        recents.push(Object.assign({}, e, {id:op.id, groupe:true, attente:!op.erreur, erreur:op.erreur||'', typeDebit:typeDe[e.debit]||'', typeCredit:typeDe[e.credit]||''}));
      });
    } else if(op.type==='modif'){
      var j=-1; recents.forEach(function(r,k){ if(r.ligne===op.ligne) j=k; });
      if(j<0) return;
      if(op.erreur){ recents[j].erreur=op.erreur; recents[j].opModif=op.id; return; }
      effet(recents[j], -1);
      Object.assign(recents[j], op.e, {attente:true, typeDebit:typeDe[op.e.debit]||'', typeCredit:typeDe[op.e.credit]||''});
      effet(recents[j], 1);
    } else if(op.type==='suppr'){
      var i=-1; recents.forEach(function(r,k){ if(r.ligne===op.ligne) i=k; });
      if(op.erreur){ if(i>=0){ recents[i].erreur=op.erreur; recents[i].opSuppr=op.id; } return; }
      if(i>=0){ effet(recents[i], -1); recents.splice(i,1); }
    }
  });
  recents.sort(function(x,y){
    if(x.date!==y.date) return x.date<y.date?1:-1;
    if(!!x.ligne!==!!y.ligne) return x.ligne?1:-1;
    return (y.ligne||0)-(x.ligne||0);
  });
  D = {
    caisses: (function(){
      var l=CACHE.caisses.map(function(c){ return c.nom; });
      comptesAvecAttente().forEach(function(c){ if(c.type==='Trésorerie' && l.indexOf(c.nom)<0) l.push(c.nom); });
      return l.map(function(n){ return {nom:n, solde:Math.round((soldes[n]||0)*100)/100}; });
    })(),
    comptes: comptesAvecAttente(), activites: activitesAvecAttente(),
    tiers: comptesAvecAttente().filter(function(c){return c.type==='Tiers';}),
    charges: comptesAvecAttente().filter(function(c){return c.type==='Charge';}),
    produits: comptesAvecAttente().filter(function(c){return c.type==='Produit';}),
    mois: mois, recents: recents, soldes: soldes, annee: annee,
    lettrage: lettrageAvecAttente()
  };
}

/* =========================================================
   Synchronisation avec le Google Sheet
   ========================================================= */
function appelScript(corps, cfg){
  cfg = cfg || CFG;
  var ctrl = ('AbortController' in window) ? new AbortController() : null;
  var minuteur = setTimeout(function(){ if(ctrl) ctrl.abort(); }, 45000);
  corps.cle = cfg.cle;
  return fetch(cfg.url, {method:'POST', body:JSON.stringify(corps), headers:{'Content-Type':'text/plain;charset=utf-8'}, redirect:'follow', signal: ctrl?ctrl.signal:undefined})
    .then(function(r){ clearTimeout(minuteur); if(!r.ok) throw new Error('Le script a répondu '+r.status); return r.json(); })
    .catch(function(e){ clearTimeout(minuteur); if(e && e.name==='AbortError') throw new Error('Pas de réponse (réseau trop lent)'); throw e; });
}

function synchroniser(manuel){
  if(!CFG){ ouvrirReglages(); return; }
  if(enCours) return;
  if(navigator.onLine===false){ derniereErreur='horsligne'; dessinerEtat(); if(manuel) toast('Pas de réseau : vos saisies sont gardées dans le téléphone.'); return; }
  var aEnvoyer = FILE.filter(function(op){ return !op.erreur; });
  enCours=true; dessinerEtat();
  aEnvoyer.forEach(function(op){ op.tente=true; }); ecrire(CLE_FILE, FILE);
  var req = aEnvoyer.length ? {action:'sync', ops:aEnvoyer} : {action:'donnees'};
  appelScript(req).then(function(rep){
    if(!rep || !rep.ok) throw new Error((rep && rep.erreur) || 'Réponse inattendue du script');
    var nbErr=0;
    if(rep.resultats){
      var parId={}; rep.resultats.forEach(function(r){ parId[r.id]=r; });
      FILE = FILE.filter(function(op){
        var r=parId[op.id]; if(!r) return true;
        if(r.ok) return false;
        op.erreur=r.erreur||'Refusée par le Sheet'; nbErr++; return true;
      });
      ecrire(CLE_FILE, FILE);
    }
    CACHE = rep.donnees; CACHE.recuLe = new Date().toISOString(); ecrire(CLE_CACHE, CACHE);
    derniereErreur='';
    enCours=false; calculer(); dessiner();
    if(aEnvoyer.length || $('v-histo').style.display!=='none'){ if($('v-histo').style.display!=='none') chargerJournal(); else GL=GL&&Object.assign(GL,{perime:true}); }
    if(nbErr) toast(nbErr+' opération(s) refusée(s) : voir le grand livre', true);
    else if(manuel) toast(aEnvoyer.length ? aEnvoyer.length+' opération(s) envoyée(s) ✓' : 'À jour ✓');
  }).catch(function(e){
    enCours=false;
    var msg = String(e && e.message || e);
    derniereErreur = /Code secret|Choisissez un code/.test(msg) ? msg : 'horsligne';
    dessinerEtat();
    if(manuel) toast(derniereErreur==='horsligne' ? 'Connexion impossible : saisies gardées dans le téléphone.' : msg, true);
  });
}

  FILE.forEach(function(op){

    if(op.type==='lettrer'){
      var ls = op.lignes.map(function(l){return l.ligne;});
      out[op.compte].forEach(function(x){ if(ls.indexOf(x.ligne)>=0){ x.lettre='⏳'; x.att=true; } });
    } else if(op.type==='delettrer'){
      out[op.compte].forEach(function(x){ if(x.lettre===op.lettre){ x.lettre=''; x.att=true; } });

}

  if(GLDEPUIS && GLDEPUIS!=='histo') fh='<button class="plus-btn" id="glRetour" style="margin:0 0 10px">← Retour : '+esc(VUES_NOMS[GLDEPUIS]||GLDEPUIS)+'</button>'+fh;
  $('glFiltres').innerHTML=fh;
  if($('glRetour')) $('glRetour').onclick=function(){ history.back(); };
  $('glFiltres').querySelectorAll('[data-glf]').forEach(function(el){ el.onchange=function(){ GLF[el.dataset.glf]=el.value; GLMAX=200; dessinerHisto(); }; });
  if($('glRaz')) $('glRaz').onclick=function(){ GLF={compte:'', domaine:'', centre:'', tiers:'', du:'', au:'', tri:GLF.tri}; dessinerHisto(); };

  var estType=function(o,nom,t){ return (o.debit===nom||o.credit===nom); };
  var L=glLignes().filter(function(o){
    if(GLF.compte && !estType(o,GLF.compte)) return false;
    if(GLF.centre && !estType(o,GLF.centre)) return false;
    if(GLF.tiers && !estType(o,GLF.tiers)) return false;
    if(GLF.domaine && o.activite!==GLF.domaine) return false;
    if(GLF.du && String(o.date)<GLF.du) return false;
    if(GLF.au && String(o.date)>GLF.au) return false;
    return true;
  });
  var focus = GLF.compte || GLF.tiers || GLF.centre || '';
  // solde cumulé du compte suivi, dans l'ordre des dates
  var td=0, tc=0, cum=0;
  L.slice().sort(function(a,b){ return a.date<b.date?-1:a.date>b.date?1:(a.ligne||1e9)-(b.ligne||1e9); }).forEach(function(o){
    if(!focus) return;
    var m=Number(o.montant)||0;
    if(o.debit===focus){ td+=m; cum+=m; } else { tc+=m; cum-=m; }
    o.cumul=Math.round(cum*100)/100;
  });
  var centreDe=function(o){ return o.typeDebit==='Charge'?o.debit:o.typeCredit==='Charge'?o.credit:''; };
  var tiersDeL=function(o){ var t={}; D.tiers.forEach(function(c){t[c.nom]=1;}); return t[o.debit]?o.debit:t[o.credit]?o.credit:''; };
  var parDate=function(a,b){ return a.date<b.date?1:a.date>b.date?-1:(b.ligne||1e9)-(a.ligne||1e9); };
  var cles={dom:function(o){return o.activite||'';}, cen:centreDe, tie:tiersDeL}[GLF.tri];
  L.sort(function(a,b){
    if(GLF.tri==='date+') return -parDate(a,b);
    if(GLF.tri==='mt-') return b.montant-a.montant;
    if(GLF.tri==='mt+') return a.montant-b.montant;
    if(cles){ var x=cles(a)||'~', y=cles(b)||'~'; if(x!==y) return x.localeCompare(y); }
    return parDate(a,b);
  });
  var tot=L.reduce(function(s,o){return s+(Number(o.montant)||0);},0);
  var th='<div class="tab">';
  th+='<div class="r" style="grid-template-columns:1fr auto"><span>'+(focus?esc(focus):'Sélection')+'</span><span>'+L.length+' ligne'+(L.length>1?'s':'')+'</span></div>';
  if(focus){
    var sol=td-tc;
    th+='<div class="r" style="grid-template-columns:1fr auto"><span>Total débit</span><span>'+mad(td)+'</span></div>'+
        '<div class="r" style="grid-template-columns:1fr auto"><span>Total crédit</span><span>'+mad(tc)+'</span></div>'+
        '<div class="r" style="grid-template-columns:1fr auto;font-weight:700"><span>Solde '+(Math.abs(sol)<0.005?'':sol>0?'débiteur':'créditeur')+'</span><span>'+mad(Math.abs(sol))+'</span></div>';
  } else th+='<div class="r" style="grid-template-columns:1fr auto;font-weight:700"><span>Total des montants</span><span>'+mad(tot)+'</span></div>';
  $('glTotaux').innerHTML=th+'</div>';
  $('glNote').textContent = glCharge ? 'Chargement du grand livre complet…' :
    glScriptAncien ? 'Mettez à jour le script du Sheet pour voir tout le grand livre (seules les 100 dernières opérations sont affichées).' :
    GL ? 'Grand livre complet reçu le '+new Date(GL.recuLe).toLocaleString('fr-FR',{dateStyle:'short',timeStyle:'short'})+(FILE.length?', + vos saisies en attente.':'.') +(focus?' Solde = débit − crédit.':'') :
    'Hors ligne : dernières opérations seulement.';
  LISTE=L;
  if(!L.length){ $('liste').innerHTML='<div class="vide">Aucune opération.</div>'; return; }
  $('liste').innerHTML=L.slice(0,GLMAX).map(function(o,i){
    var s=sens(o), signe, cls;
    if(focus){ signe=o.debit===focus?'D ':'C '; cls=o.debit===focus?'rec':'dep'; }
    else { signe=s==='dep'?'− ':s==='rec'?'+ ':''; cls=s; }
    var etat = o.erreur ? '<div class="l3">⚠ Refusée : '+esc(o.erreur)+'</div>' : o.attente ? '<div class="l3">⏳ En attente d\'envoi</div>' : '';
    return '<button class="op'+(o.erreur?' err':o.attente?' att':'')+'" data-i="'+i+'"><div><div class="l1">'+esc(o.libelle||o.debit)+'</div>'+
      '<div class="l2">'+dateFr(o.date)+' · '+esc(o.debit)+' ← '+esc(o.credit)+(o.activite?' · '+esc(o.activite):'')+(o.lettre?' · '+esc(o.lettre):'')+'</div>'+etat+'</div>'+
      '<div style="text-align:right"><div class="m '+cls+'">'+signe+mad(o.montant)+'</div>'+(focus&&o.cumul!==undefined?'<div class="l2">solde '+mad(o.cumul)+'</div>':'')+'</div></button>';
  }).join('') + (L.length>GLMAX?'<button class="plus-btn" id="glPlus">Afficher plus ('+(L.length-GLMAX)+' restantes)</button>':'');
  if($('glPlus')) $('glPlus').onclick=function(){ GLMAX+=300; dessinerHisto(); };
}

/* =========================================================
   Détail et suppression
   ========================================================= */
var DETAIL=null;
function detail(o, action){
  if(!o) return; DETAIL=o;
  var rows=[['Date',dateFr(o.date)],['N° pièce',o.piece||'auto'],['Libellé',o.libelle],['Débit (reçoit)',o.debit],['Crédit (donne)',o.credit],['Montant',mad(o.montant)],['Domaine',o.activite]];
  if(o.ligne) rows.push(['Ligne du Journal',o.ligne]);
  var b = o.erreur ? '<div class="bandeau err">Refusée par le Sheet : '+esc(o.erreur)+'</div>' :
          o.attente ? '<div class="bandeau att">Enregistrée dans le téléphone, pas encore envoyée au Sheet. Elle partira dès que le réseau revient.</div>' : '';
  var lib = o.id ? 'Annuler cette saisie' : o.opModif ? 'Abandonner la modification' : o.opSuppr ? 'Abandonner la suppression' : 'Supprimer cette opération';
  if(action && action.info) b += '<div class="bandeau att">'+esc(action.info)+'</div>';
  document.getElementById('detailCorps').innerHTML = b + rows.map(function(r){return '<div class="ligne2"><span>'+r[0]+'</span><span>'+esc(r[1])+'</span></div>';}).join('') +
    (action ? '<button class="valider" id="btnAction">'+esc(action.lib)+'</button>' : '') +
    '<button class="valider" id="btnModif"'+(action?' style="background:#fff;color:var(--vert);border:2px solid var(--vert);margin-top:10px"':'')+'>✏️ Modifier</button>' +
    '<button class="suppr" id="btnSuppr">'+lib+'</button>';
  document.getElementById('btnSuppr').onclick=supprimer;
  if(action) document.getElementById('btnAction').onclick=action.fn;
  document.getElementById('btnModif').onclick=function(){ fermer('detail'); ouvrirForm('aut', o); };
  document.getElementById('detail').className='ecran on';
}
function supprimer(){
  var o=DETAIL; if(!o) return;
  if(o.id){                         // saisie pas encore envoyée (ou refusée) : on la retire du téléphone
    if(!confirm(o.groupe ? 'Annuler cette saisie (facture et règlement liés) ?' : 'Annuler la saisie « '+(o.libelle||o.debit)+' » de '+mad(o.montant)+' ?')) return;
    var cible=FILE.filter(function(op){return op.id===o.id;})[0];
    FILE=FILE.filter(function(op){return op.id!==o.id;});
    // si un envoi a déjà été tenté, le Sheet l'a peut-être reçue : on lui demande de l'annuler
    if(cible && cible.tente && !cible.erreur)
      FILE.push({id:nouvelId(), type:'annul', cible:o.id, controle:{debit:o.debit, credit:o.credit, montant:o.montant}});
  } else if(o.opModif){             // modification refusée : on l'abandonne
    FILE=FILE.filter(function(op){return op.id!==o.opModif;});
  } else if(o.opSuppr){             // suppression refusée : on l'abandonne
    FILE=FILE.filter(function(op){return op.id!==o.opSuppr;});
  } else {                          // opération déjà dans le Sheet : suppression mise en file
    if(!confirm('Supprimer « '+(o.libelle||o.debit)+' » de '+mad(o.montant)+' ?')) return;
    FILE.push({id:nouvelId(), type:'suppr', ligne:o.ligne, controle:{debit:o.debit, credit:o.credit, montant:o.montant}});
  }
  ecrire(CLE_FILE, FILE); calculer(); dessiner(); fermer('detail'); toast('C\'est fait');
  synchroniser(false);
}

var CONF={
  dep:{titre:'Dépense', coul:'var(--rouge)', lbCaisse:'Payée avec (caisse ou banque)', lbTard:'Sera payée avec (caisse ou banque)', lbEch:'À payer le', lbRub:'Centre de dépense', lbTiers:'Fournisseur (facultatif)', grp:'Fournisseur', divers:'DIVERS À PAYER'},
  rec:{titre:'Recette', coul:'var(--vert2)', lbCaisse:'Encaissée dans (caisse ou banque)', lbTard:'Sera encaissée dans (caisse ou banque)', lbEch:'À encaisser le', lbRub:'Catégorie de recette', lbTiers:'Client (facultatif)', grp:'Client', divers:'DIVERS À ENCAISSER'},
  reg:{titre:'Payer une dette', coul:'#6B4E9B', lbCaisse:'Payé avec la caisse', lbTiers:'Fournisseur à régler', grp:'Fournisseur'},
  enc:{titre:'Encaisser un client', coul:'#1F7A6B', lbCaisse:'Encaissé dans la caisse', lbTiers:'Client', grp:'Client'},
  tra:{titre:'Transfert entre caisses', coul:'var(--bleu)', lbCaisse:'De la caisse'},
  aut:{titre:'Autre écriture', coul:'var(--vert)'}
};
function activiteDe(caisse){
  var c=norm(caisse), best='';
  D.activites.forEach(function(a){ var n=norm(a); if(n && c.indexOf(n)>=0 && n.length>best.length) best=a; });
  return best || (D.activites.indexOf('Général')>=0?'Général':(D.activites[0]||''));
}
function chips(id, liste, val, cb, plus){
  var el=document.getElementById(id);
  el.innerHTML=liste.map(function(x){ return '<button type="button" class="chip'+(x===val?' on':'')+'" data-v="'+esc(x)+'">'+esc(x)+'</button>'; }).join('')+
    (plus ? '<button type="button" class="chip plus" data-v="+">＋ '+esc(plus)+'</button>' : '');
  Array.prototype.forEach.call(el.children, function(b){ b.onclick=function(){ cb(b.dataset.v); }; });
}
function options(sel, comptes){
  var g={}, ordre=[];
  comptes.forEach(function(c){ var k=c.groupe||c.type||'Autres'; if(!g[k]){g[k]=[];ordre.push(k);} g[k].push(c.nom); });
  sel.innerHTML='<option value="">— choisir —</option>'+ordre.map(function(k){
    return '<optgroup label="'+esc(k)+'">'+g[k].map(function(n){return '<option value="'+esc(n)+'">'+esc(n)+'</option>';}).join('')+'</optgroup>';
  }).join('');
}
function $(id){ return document.getElementById(id); }
function nombre(id){ var v=$(id).value.replace(/\s/g,'').replace(',','.'); return v==='' ? NaN : Number(v); }
function lireMontant(){ return nombre('f-montant'); }
function tiersDe(grp){
  return D.tiers.filter(function(c){ return grp==='Client' ? c.groupe==='Client' : c.groupe!=='Client'; })
    .map(function(c){ return c.nom; }).sort(function(a,b){ return a.localeCompare(b); });
}
function soldeTiersTxt(nom){
  var s=(D.soldes||{})[nom]||0;
  if(Math.abs(s)<0.005) return 'Solde actuel : 0 (rien en cours)';
  return s<0 ? 'Vous lui devez actuellement '+mad(-s) : 'Il vous doit actuellement '+mad(s)+' (avance ou facture client)';
}

function ouvrirForm(type, edit){
  if(!D){ ouvrirReglages(); return; }
  var EDIT=edit||null;
  var caisses=D.caisses.map(function(c){return c.nom;});
  var dern=lire(CLE_DERN,'');
  F={type:type, caisse: caisses.indexOf(dern)>=0 ? dern : (caisses.filter(function(c){return /caisse/i.test(c);})[0]||caisses[0]||''), vers:'', quand:'now'};
  if(type==='tra') F.vers=caisses.filter(function(c){return c!==F.caisse;})[0]||'';
  F.activite = type==='tra' ? (D.activites.indexOf('Général')>=0?'Général':activiteDe(F.vers)) : activiteDe(F.caisse);
  var c=CONF[type];
  $('formTitre').textContent=c.titre;
  $('formBarre').style.background=c.coul;
  $('btnValider').style.background=c.coul;
  $('bloc-tiers').style.display = c.lbTiers ? '' : 'none';
  $('bloc-rub').style.display = (type==='dep'||type==='rec') ? '' : 'none';
  $('bloc-vers').style.display = type==='tra' ? '' : 'none';
  $('bloc-libre').style.display = type==='aut' ? '' : 'none';
  if(c.lbCaisse) $('lb-caisse').textContent=c.lbCaisse;
  if(c.lbRub) $('lb-rub').textContent=c.lbRub;
  $('bloc-quand').style.display = (type==='dep'||type==='rec') ? '' : 'none';
  if(c.lbEch) $('lb-ech').textContent=c.lbEch;
  if(type==='dep'||type==='rec') remplirRub('');
  if(type==='aut'){ options($('f-deb'), D.comptes); options($('f-cre'), D.comptes); }
  ['f-montant','f-lib','f-piece','f-ech'].forEach(function(id){ $(id).value=''; });
  $('f-date').value=aujourdhui();
  $('btnValider').disabled=false;
  if(c.lbTiers) remplirTiers('');
  var anF=new Date().getFullYear();
  chips('c-ech', ['Fin '+anF,'Fin '+(anF+1),'Fin '+(anF+2)], '', function(v){ $('f-ech').value=v.slice(4)+'-12-31'; resume(); });
  majQuand();
  F.edit=EDIT;
  $('btnValider').textContent = EDIT ? 'Enregistrer la modification' : 'Enregistrer';
  if(EDIT){
    $('formTitre').textContent='Modifier l\'écriture';
    $('f-montant').value=String(EDIT.montant).replace('.',',');
    $('f-deb').value=EDIT.debit; $('f-cre').value=EDIT.credit;
    $('f-date').value=EDIT.date||aujourdhui();
    $('f-piece').value=EDIT.piece||''; $('f-lib').value=EDIT.libelle||'';
    F.activite=EDIT.activite||F.activite;
    if(D.activites.indexOf(F.activite)<0 && F.activite) D.activites=D.activites.concat([F.activite]);
  }
  majChoix(); majVisibilite();
  $('form').className='ecran on';
  setTimeout(function(){ $('f-montant').focus(); },150);
}
function remplirRub(val){
  var dep=F.type==='dep';
  options($('f-rub'), dep?D.charges:D.produits);
  $('f-rub').insertAdjacentHTML('beforeend','<option value="+">＋ '+(dep?'Nouveau centre de dépense':'Nouvelle catégorie de recette')+'…</option>');
  $('f-rub').value=val||'';
}
$('f-rub').addEventListener('change', function(){
  if(this.value!=='+') return;
  ouvrirNouveau(F.type==='dep'?'charge':'produit', function(n){ remplirRub(n); majVisibilite(); }, function(){ $('f-rub').value=''; majVisibilite(); });
});
function remplirTiers(val){
  var c=CONF[F.type], grp=c.grp, sel=$('f-tiers');
  var vide = (F.type==='dep'||F.type==='rec') ? '— Aucun —' : '— choisir —';
  sel.innerHTML='<option value="">'+vide+'</option>' + tiersDe(grp).map(function(n){ return '<option value="'+esc(n)+'"'+(n===val?' selected':'')+'>'+esc(n)+'</option>'; }).join('') +
    '<option value="+">＋ Nouveau tiers…</option>';
  $('lb-tiers').textContent=c.lbTiers;
}
function tiersChoisi(){ var v=$('f-tiers').value; return v==='+' ? '' : v; }
function majQuand(){
  $('q-now').className = F.quand==='now' ? 'on' : '';
  $('q-tard').className = F.quand==='tard' ? 'on' : '';
  $('q-now').textContent = F.type==='rec' ? 'Encaissée maintenant' : 'Payée maintenant';
  $('q-tard').textContent = F.type==='rec' ? 'À encaisser plus tard' : 'À payer plus tard';
}
document.querySelector('#bloc-quand .quand').addEventListener('click', function(ev){
  var b=ev.target.closest('[data-q]'); if(!b) return;
  F.quand=b.dataset.q; majQuand(); majVisibilite();
  if(F.quand==='tard' && !$('f-ech').value) $('f-ech').focus();
});
function plusTard(){ return (F.type==='dep'||F.type==='rec') && F.quand==='tard'; }
function majVisibilite(){
  var t=F.type, tiers=CONF[t].lbTiers ? tiersChoisi() : '', tard=plusTard();
  $('bloc-ech').style.display = tard ? '' : 'none';
  $('bloc-caisse').style.display = t!=='aut' ? '' : 'none';
  if(CONF[t].lbCaisse) $('lb-caisse').textContent = tard ? CONF[t].lbTard : CONF[t].lbCaisse;
  var note='';
  if(tiers) note = soldeTiersTxt(tiers);
  else if(tard) note = 'Sans '+(t==='dep'?'fournisseur':'client')+', elle sera notée dans « '+CONF[t].divers+' ».';
  $('note-tiers').textContent=note;
  resume();
}
function majChoix(){
  var caisses=D.caisses.map(function(c){return c.nom;});
  chips('c-caisse', caisses, F.caisse, function(v){
    if(v==='+') return ouvrirNouveau('caisse', function(n){ F.caisse=n; if(F.type!=='tra') F.activite=activiteDe(n); majChoix(); });
    F.caisse=v;
    if(F.type==='tra'){ if(F.vers===v) F.vers=caisses.filter(function(c){return c!==v;})[0]||''; }
    else F.activite=activiteDe(v);
    majChoix();
  }, 'Caisse / banque');
  chips('c-vers', caisses.filter(function(c){return c!==F.caisse;}), F.vers, function(v){
    if(v==='+') return ouvrirNouveau('caisse', function(n){ F.vers=n; majChoix(); });
    F.vers=v; majChoix(); }, 'Caisse / banque');
  chips('c-act', D.activites, F.activite, function(v){
    if(v==='+') return ouvrirNouveau('domaine', function(n){ F.activite=n; majChoix(); });
    F.activite=v; majChoix(); }, 'Domaine');
  resume();
}
/* Les écritures que va créer le formulaire */
function ecritures(){
  var t=F.type, m=lireMontant(), rub=$('f-rub').value, tiers=tiersChoisi(), tard=plusTard(), out=[], lettrer='';
  if(isNaN(m)) m=0;
  if(rub==='+') rub='';
  if(t==='dep'){
    if(tard) out.push({debit:rub, credit:tiers||CONF.dep.divers, montant:m, role:'facture'});
    else if(tiers){ out.push({debit:rub, credit:tiers, montant:m, role:'facture'}); out.push({debit:tiers, credit:F.caisse, montant:m, role:'reglement'}); lettrer=tiers; }
    else out.push({debit:rub, credit:F.caisse, montant:m, role:'comptant'});
  } else if(t==='rec'){
    if(tard) out.push({debit:tiers||CONF.rec.divers, credit:rub, montant:m, role:'facture'});
    else if(tiers){ out.push({debit:tiers, credit:rub, montant:m, role:'facture'}); out.push({debit:F.caisse, credit:tiers, montant:m, role:'reglement'}); lettrer=tiers; }
    else out.push({debit:F.caisse, credit:rub, montant:m, role:'comptant'});
  } else if(t==='reg') out.push({debit:tiers, credit:F.caisse, montant:m, role:'reglement'});
  else if(t==='enc') out.push({debit:F.caisse, credit:tiers, montant:m, role:'reglement'});
  else if(t==='tra') out.push({debit:F.vers, credit:F.caisse, montant:m, role:'transfert'});
  else out.push({debit:$('f-deb').value, credit:$('f-cre').value, montant:m, role:'libre'});
  return {lignes:out, lettrer:lettrer};
}
function resume(){
  var r=ecritures();
  $('resume').innerHTML = r.lignes.map(function(e,i){
    return (r.lignes.length>1 ? '<b>'+(i+1)+'.</b> ' : 'Écriture : ')+'<b>Débit</b> '+esc(e.debit||'…')+' &nbsp;/&nbsp; <b>Crédit</b> '+esc(e.credit||'…')+(e.montant>0?' &nbsp;·&nbsp; <b>'+mad(e.montant)+'</b>':'');
  }).join('<br>') + (F.activite?'<br>Domaine : '+esc(F.activite):'') + (r.lettrer?'<br>✓ Facture et règlement seront lettrés ensemble.':'') + (plusTard()?'<br>⌛ '+(F.type==='rec'?'À encaisser':'À payer')+' le <b>'+(echSaisie()?dateFr(echSaisie()):'(date non choisie)')+'</b> avec <b>'+esc(F.caisse)+'</b>':'');
}
['f-montant','f-rub','f-deb','f-cre'].forEach(function(id){
  var el=$(id); el.addEventListener('input',majVisibilite); el.addEventListener('change',majVisibilite);
});
$('f-ech').addEventListener('change', resume);
$('f-tiers').addEventListener('change', function(){

    ouvrirNouveau('tiers', function(n){ remplirTiers(n); majVisibilite(); }, function(){ $('f-tiers').value=''; majVisibilite(); });
    return;
  }
  majVisibilite();
});

function valider(){
  var r=ecritures(), m=lireMontant(), t=F.type, tiers=CONF[t].lbTiers ? tiersChoisi() : '';
  if(!(m>0)) return toast('Saisissez un montant', true);
  if((t==='dep'||t==='rec') && (!$('f-rub').value || $('f-rub').value==='+')) return toast(t==='dep'?'Choisissez le centre de dépense':'Choisissez la catégorie', true);
  if((t==='reg'||t==='enc') && !tiers) return toast('Choisissez le '+(t==='reg'?'fournisseur':'client'), true);
  if(t==='aut' && (!r.lignes[0].debit || !r.lignes[0].credit)) return toast('Choisissez les deux comptes', true);
  for(var i=0;i<r.lignes.length;i++){ if(r.lignes[i].debit===r.lignes[i].credit) return toast('Débit et crédit doivent être différents', true); }
  if(!F.activite) return toast('Choisissez un domaine', true);
  if(plusTard() && !echSaisie()) return toast('Choisissez la date '+(t==='rec'?'d\'encaissement':'de paiement'), true);

    else if(e.role==='reglement') l = (t==='dep'||t==='reg' ? 'Règlement ' : 'Encaissement ')+tiers+(lib?' · '+lib:'');
    else if(e.role==='comptant') l = lib || (t==='dep' ? e.debit : e.credit);
    else if(e.role==='transfert') l = lib || 'Transfert '+F.caisse+' → '+F.vers;
    return {date:date, piece:piece, libelle:l, debit:e.debit, credit:e.credit, montant:Math.round(e.montant*100)/100, activite:F.activite, horodatage:h};
  });
  if(F.edit) return enregistrerModif(F.edit, {e:lignes[0]});

  $('btnValider').disabled=true;
  // dépense ou recette à plus tard sans tiers : compte « DIVERS À PAYER / À ENCAISSER », créé s'il n'existe pas

  calculer(); dessiner(); fermer('form');
  toast(navigator.onLine===false ? 'Enregistré dans le téléphone ✓' : 'Enregistré ✓');
  synchroniser(false);
}

/* Modification d'une écriture */
function enregistrerModif(o, nouvelle){
  var ne = nouvelle.e;
  if(o.id){
    var ancienne = FILE.filter(function(x){return x.id===o.id;})[0];
    if(ancienne && ancienne.type==='groupe'){ toast('Pas encore envoyée : annulez cette saisie puis ressaisissez-la.', true); return; }
    if(ancienne && !ancienne.tente && !ancienne.erreur){
      ancienne.e = Object.assign(ancienne.e, ne, {horodatage:ancienne.e.horodatage});
    } else {
      FILE = FILE.filter(function(x){return x.id!==o.id;});
      if(ancienne && ancienne.tente && !ancienne.erreur)
        FILE.push({id:nouvelId(), type:'annul', cible:o.id, controle:{debit:o.debit, credit:o.credit, montant:o.montant}});
      FILE.push({id:nouvelId(), type:'ajout', e:ne});
    }
  } else {
    if(o.opModif) FILE = FILE.filter(function(x){return x.id!==o.opModif;});
    var enCoursModif = FILE.filter(function(x){return x.type==='modif' && x.ligne===o.ligne && !x.tente && !x.erreur;})[0];
    var e2 = {date:ne.date, piece:ne.piece, libelle:ne.libelle, debit:ne.debit, credit:ne.credit, montant:ne.montant, activite:ne.activite};
    if(enCoursModif) enCoursModif.e = e2;
    else FILE.push({id:nouvelId(), type:'modif', ligne:o.ligne, controle:{debit:o.debit, credit:o.credit, montant:o.montant}, e:e2});
  }
  ecrire(CLE_FILE, FILE);
  F.edit = null;
  calculer(); dessiner(); fermer('form');
  toast('Modification enregistrée ✓');
  synchroniser(false);
}

/* =========================================================
   À payer : dettes fournisseurs non réglées, classées par échéance.
   L'échéance est écrite dans le libellé (« · éch. 30/06/2027 »),
   ou une année seule dans le libellé (« 2027 ») = à payer cette année-là.
   Les paiements non lettrés d'un fournisseur soldent ses dettes
   de la plus ancienne échéance à la plus récente.
   ========================================================= */
function echSaisie(){
  return ($('bloc-ech') && $('bloc-ech').style.display!=='none') ? $('f-ech').value : '';
}
function echeanceDe(lib, date){
  var s=String(lib||''), d=String(date||'').slice(0,10);
  var m=s.match(/[ée]ch\.?\s*:?\s*(\d{1,2})\/(\d{1,2})\/(\d{4})/i);
  var via=(s.match(/·\s*via\s+(.+?)\s*(?:·|$)/i)||[])[1]||'';
  if(m) return {ech:m[3]+'-'+deux(m[2])+'-'+deux(m[1]), annee:false, via:via};
  var y=s.match(/(?:^|\D)(20\d\d)(?!\d)/);
  if(y && Number(y[1])>Number(d.slice(0,4))) return {ech:y[1]+'-12-31', annee:true, via:via};
  return {ech:d, annee:false, via:via};
}
function sansEch(lib){ return String(lib||'').replace(/\s*·\s*[ée]ch\.?\s*:?\s*\d{1,2}\/\d{1,2}\/\d{4}/i,'').replace(/\s*·\s*via\s+.*$/i,'').trim(); }
function dettes(){ return enCours_(false); }
function creances(){ return enCours_(true); }
/* client=false : ce que vous devez (dettes fournisseurs) ; client=true : ce qu'on vous doit (créances clients) */
function enCours_(client){
  if(!D) return [];
  var four={}; D.tiers.forEach(function(c){ if(client ? c.groupe==='Client' : (c.groupe!=='Client' && c.groupe!=='Avance')) four[c.nom]=1; });
  var DU = client ? 'D' : 'C', REGLE = client ? 'C' : 'D';
  var parT={};
  function ajoute(t, x){ (parT[t]=parT[t]||[]).push(x); }
  Object.keys(D.lettrage||{}).forEach(function(k){
    if(!four[k]) return;
    D.lettrage[k].forEach(function(x){ if(x.lettre) return;
      ajoute(k, {ligne:x.ligne, date:x.date, libelle:x.libelle, contre:x.contrepartie, montant:Number(x.montant)||0, sens:x.sens, activite:x.activite, piece:x.piece}); });
  });
  FILE.forEach(function(op){
    if(op.erreur) return;
    var es = op.type==='ajout' ? [op.e] : op.type==='groupe' ? op.ecritures : [];
    es.forEach(function(e){
      if(four[e.credit]) ajoute(e.credit, {id:op.id, date:e.date, libelle:e.libelle, contre:e.debit, montant:Number(e.montant)||0, sens:'C', att:true});
      if(four[e.debit]) ajoute(e.debit, {id:op.id, date:e.date, libelle:e.libelle, contre:e.credit, montant:Number(e.montant)||0, sens:'D', att:true});
    });
  });
  var auj=aujourdhui(), out=[];
  Object.keys(parT).forEach(function(t){
    var l=parT[t], paye=l.filter(function(x){return x.sens===REGLE;}).reduce(function(s,x){return s+x.montant;},0);
    l.filter(function(x){return x.sens===DU;}).map(function(x){ var e=echeanceDe(x.libelle, x.date); return Object.assign({}, x, e, {tiers:t, client:client}); })
     .sort(function(a,b){ return a.ech<b.ech?-1:a.ech>b.ech?1:0; })
     .forEach(function(x){
       var pris=Math.min(paye, x.montant); paye-=pris;
       x.reste=Math.round((x.montant-pris)*100)/100;
       if(x.reste>0.005){ x.retard = !x.annee && x.ech<auj; out.push(x); }
     });
  });
  return out.sort(function(a,b){ return a.ech<b.ech?-1:a.ech>b.ech?1:0; });
}
function txtEch(x){ return x.annee ? 'Année '+x.ech.slice(0,4) : dateFr(x.ech); }
function resumeApayer(dt){
  var an=new Date().getFullYear(), mc=moisCourant(), auj=aujourdhui(), lignes=[];
  var som=function(f){ return dt.filter(f).reduce(function(s,x){return s+x.reste;},0); };
  lignes.push(['En retard', som(function(x){return x.retard;}), true]);
  lignes.push(['Ce mois-ci', som(function(x){return !x.retard && !x.annee && x.ech.slice(0,7)===mc;})]);
  lignes.push(['Reste de '+an, som(function(x){return !x.retard && x.ech.slice(0,4)===String(an) && (x.annee || x.ech.slice(0,7)!==mc);})]);
  lignes.push([String(an+1), som(function(x){return x.ech.slice(0,4)===String(an+1);})]);
  lignes.push([String(an+2)+' et après', som(function(x){return Number(x.ech.slice(0,4))>=an+2;})]);
  var tot=dt.reduce(function(s,x){return s+x.reste;},0);
  if(tot<0.005) return '<div class="vide">Aucune dette en cours 👍</div>';
  return lignes.filter(function(r){return r[1]>0.005;}).map(function(r){
    return '<div class="r" style="grid-template-columns:1fr auto"><span'+(r[2]?' class="ret"':'')+'>'+r[0]+'</span><span style="font-weight:700'+(r[2]?';color:var(--rouge)':'')+'">'+mad(r[1])+'</span></div>';
  }).join('') + '<div class="r" style="grid-template-columns:1fr auto;font-weight:700"><span>Total à payer ›</span><span>'+mad(tot)+'</span></div>';
}
var AFILTRE='Tout', ALISTE=[], AMODE='payer';

  if(AFILTRE==='Par tiers'){

    h+='<div class="tab" style="margin-top:8px">'+noms.map(function(n){ return '<div class="r" style="grid-template-columns:1fr auto"><span>'+esc(n)+'</span><span style="font-weight:700">'+mad(g[n])+'</span></div>'; }).join('')+'</div>';

  h+='<div class="tab" style="margin-top:8px"><div class="r" style="grid-template-columns:1fr auto;font-weight:700"><span>Total '+(AFILTRE==='Tout'?'':esc(AFILTRE))+'</span><span>'+mad(tot)+'</span></div></div>';
  h+='<p class="note" style="margin:8px 2px 10px">'+(AMODE==='encaisser'?'Touchez une ligne quand l\'argent est reçu.':'Touchez une ligne pour la payer.')+' Pour en ajouter : « '+(AMODE==='encaisser'?'Recette':'Dépense')+' » puis « Plus tard ».</p>';
  h+= ALISTE.length ? ALISTE.map(function(x,i){
    return '<button class="op'+(x.att?' att':'')+'" data-ai="'+i+'"><div><div class="l1">'+esc(sansEch(x.libelle)||x.contre)+'</div>'+
      '<div class="l2">'+esc(x.tiers)+' · '+esc(x.contre||'')+' · saisi le '+dateFr(x.date)+'</div>'+
      '<div class="l3"'+(x.retard?' style="color:var(--rouge)"':'')+'>'+(x.retard?'⚠ En retard · ':'⌛ ')+'Échéance : '+txtEch(x)+(x.via?' · '+esc(x.via):'')+(x.att?' · en attente d\'envoi':'')+'</div></div>'+
      '<div style="text-align:right"><div class="m '+(x.client?'rec':'dep')+'">'+mad(x.reste)+'</div>'+(x.reste<x.montant-0.005?'<div class="l2">sur '+mad(x.montant)+'</div>':'')+'</div></button>';
  }).join('') : '<div class="vide">Rien à payer ici.</div>';
  z.innerHTML=h; brancherApayer(z);

/* =========================================================
   Balance générale : pour chaque compte, total débit, total crédit,
   solde débiteur ou créditeur, sur la période et le domaine choisis.
   ========================================================= */
function dessinerBalance(z, bascule){
  var an=new Date().getFullYear(), mc=moisCourant();
  var du=BF.du, au=BF.au;
  if(BF.periode==='annee'){ du=BF.an+'-01-01'; au=BF.an+'-12-31'; }
  else if(BF.periode==='mois'){ du=BF.mois+'-01'; au=BF.mois+'-31'; }
  else if(BF.periode==='tout'){ du=''; au=''; }
  var L=glLignes().filter(function(o){
    if(o.erreur) return false;
    if(du && String(o.date)<du) return false;
    if(au && String(o.date)>au) return false;
    if(BF.domaine && o.activite!==BF.domaine) return false;
    if(BF.centre && o.debit!==BF.centre && o.credit!==BF.centre) return false;
    if(BF.tiers && o.debit!==BF.tiers && o.credit!==BF.tiers) return false;
    return true;
  });
  var mv={};
  L.forEach(function(o){ var m=Number(o.montant)||0;
    (mv[o.debit]=mv[o.debit]||{d:0,c:0}).d+=m; (mv[o.credit]=mv[o.credit]||{d:0,c:0}).c+=m; });
  var typeDe={}, codeDe={}; D.comptes.forEach(function(c){ typeDe[c.nom]=c.type; codeDe[c.nom]=c.code||''; });
  var ordre=[['Trésorerie','Caisses et banques'],['Tiers','Tiers (fournisseurs, clients, avances)'],['Charge','Dépenses (centres de dépense)'],['Produit','Recettes'],['','Autres comptes']];
  var groupes={}; ordre.forEach(function(g){ groupes[g[0]]=[]; });
  Object.keys(mv).forEach(function(n){ var t=typeDe[n]; if(!groupes[t]) t=''; groupes[t].push(n); });
  var T={d:0,c:0,sd:0,sc:0};
  var cols='grid-template-columns:1.6fr 1fr 1fr 1fr 1fr';
  var ligne=function(nom, x, gras, lien){
    var s=x.d-x.c, sd=s>0.005?s:0, sc=s<-0.005?-s:0;
    return '<div class="r'+(lien?' lien-l':'')+'" style="'+cols+(gras?';font-weight:700;background:#F7F9F7':'')+'"'+(lien?' data-bc="'+esc(nom)+'"':'')+'><span style="word-break:break-word">'+esc(nom)+'</span><span>'+fmtc(x.d)+'</span><span>'+fmtc(x.c)+'</span><span>'+(sd?fmtc(sd):'')+'</span><span>'+(sc?fmtc(sc):'')+'</span></div>';
  };
  var corps='';
  ordre.forEach(function(g){
    var noms=groupes[g[0]]; if(!noms.length) return;
    noms.sort(function(a,b){ var x=codeDe[a]||'', y=codeDe[b]||''; return x!==y ? x.localeCompare(y,undefined,{numeric:true}) : a.localeCompare(b); });
    var st={d:0,c:0};
    if(BF.vue==='detail') corps+='<div class="r" style="grid-template-columns:1fr;color:var(--vert);font-weight:700">'+g[1]+'</div>';
    noms.forEach(function(n){ st.d+=mv[n].d; st.c+=mv[n].c; if(BF.vue==='detail') corps+=ligne(n, mv[n], false, true); });
    corps+=ligne(BF.vue==='detail'?'Total '+g[1].split(' (')[0].toLowerCase():g[1], st, true, false);
    T.d+=st.d; T.c+=st.c;
  });
  var sTot={sd:0,sc:0}; Object.keys(mv).forEach(function(n){ var s=mv[n].d-mv[n].c; if(s>0) sTot.sd+=s; else sTot.sc-=s; });
  var equilibre=Math.abs(T.d-T.c)<0.01 && Math.abs(sTot.sd-sTot.sc)<0.01;

  var MOIS=['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
  var nomMois=function(m){ return MOIS[Number(m.slice(5))-1]+' '+m.slice(0,4); };
  var titrePer = BF.periode==='tout' ? 'depuis le début' : BF.periode==='annee' ? 'année '+BF.an : BF.periode==='mois' ? nomMois(BF.mois) :
    (du?'du '+dateFr(du):'')+(au?' au '+dateFr(au):'');
  var h=bascule+'<h2>Balance générale</h2>';
  h+='<div class="nonimp"><div class="filtres">'+[['tout','Depuis le début'],['annee','Par année'],['mois','Par mois'],['choix','Période…']].map(function(x){
      return '<button class="chip'+(BF.periode===x[0]?' on':'')+'" data-bp="'+x[0]+'">'+x[1]+'</button>'; }).join('')+'</div>';
  if(BF.periode==='annee'||BF.periode==='mois')
    h+='<div class="navper"><button data-nav="-1">◀</button><span>'+(BF.periode==='annee'?'Année '+BF.an:nomMois(BF.mois))+'</span><button data-nav="1">▶</button></div>';
  h+='<div class="glf" style="margin-top:8px">'+(BF.periode==='choix'?'<div><label>Du</label><input type="date" data-bf="du" value="'+esc(BF.du)+'"></div><div><label>Au</label><input type="date" data-bf="au" value="'+esc(BF.au)+'"></div>':'')+
    '<div><label>Domaine</label><select data-bf="domaine"><option value="">Tous</option>'+D.activites.map(function(a){ return '<option'+(BF.domaine===a?' selected':'')+'>'+esc(a)+'</option>'; }).join('')+'</select></div>'+
    '<div><label>Centre de dépense (rubrique)</label><select data-bf="centre"><option value="">Tous</option>'+D.charges.concat(D.produits).map(function(c){ return '<option'+(BF.centre===c.nom?' selected':'')+'>'+esc(c.nom)+'</option>'; }).join('')+'</select></div>'+
    '<div><label>Tiers</label><select data-bf="tiers"><option value="">Tous</option>'+D.tiers.slice().sort(function(a,b){return a.nom.localeCompare(b.nom);}).map(function(c){ return '<option'+(BF.tiers===c.nom?' selected':'')+'>'+esc(c.nom)+'</option>'; }).join('')+'</select></div>'+
    '<div><label>Affichage</label><select data-bf="vue"><option value="detail"'+(BF.vue==='detail'?' selected':'')+'>Tous les comptes</option><option value="synthese"'+(BF.vue==='synthese'?' selected':'')+'>Totaux par classe</option></select></div></div></div>';
  var ft=(BF.domaine?' · Domaine : '+BF.domaine:'')+(BF.centre?' · Centre : '+BF.centre:'')+(BF.tiers?' · Tiers : '+BF.tiers:'');
  h+='<div class="imp-titre">Balance générale — '+esc(titrePer)+esc(ft)+'</div>';
  h+='<p class="note">Période : <b>'+esc(titrePer)+'</b>'+esc(ft)+' · '+L.length+' écriture'+(L.length>1?'s':'')+(glCharge?' · chargement…':GL?'':' · grand livre complet non chargé (hors ligne) : dernières opérations seulement')+'</p>';
  h+='<div class="tab bal" style="margin-top:8px"><div class="r" style="'+cols+'"><span>Compte</span><span>Débit</span><span>Crédit</span><span>Solde D</span><span>Solde C</span></div>'+
     (corps||'<div class="vide">Aucune écriture sur cette période.</div>')+
     '<div class="r" style="'+cols+';font-weight:800;border-top:2px solid var(--vert)"><span>TOTAL</span><span>'+fmtc(T.d)+'</span><span>'+fmtc(T.c)+'</span><span>'+fmtc(sTot.sd)+'</span><span>'+fmtc(sTot.sc)+'</span></div></div>';
  h+='<p class="note" style="color:'+(equilibre?'var(--vert2)':'var(--rouge)')+';font-weight:700">'+(equilibre?'Équilibrée ✓ (total débit = total crédit)':'⚠ Déséquilibre de '+mad(T.d-T.c))+'</p>';
  h+='<p class="note nonimp">Solde D (débiteur) : argent en caisse, dépense, somme qu\'on vous doit. Solde C (créditeur) : recette, somme que vous devez. Touchez un compte pour voir son grand livre.</p>';
  h+='<button class="plus-btn nonimp" id="balImp">🖨 Imprimer / enregistrer en PDF</button>';
  z.innerHTML=h; brancherBascule(z);
  z.querySelectorAll('[data-bp]').forEach(function(b){ b.onclick=function(){ BF.periode=b.dataset.bp; dessinerSoldes(); }; });
  z.querySelectorAll('[data-nav]').forEach(function(b){ b.onclick=function(){
    var d=Number(b.dataset.nav);
    if(BF.periode==='annee') BF.an+=d;
    else { var y=Number(BF.mois.slice(0,4)), m=Number(BF.mois.slice(5))-1+d; y+=Math.floor(m/12); m=((m%12)+12)%12; BF.mois=y+'-'+deux(m+1); }
    dessinerSoldes(); }; });
  z.querySelectorAll('[data-bf]').forEach(function(el){ el.onchange=function(){ BF[el.dataset.bf]=el.value; dessinerSoldes(); }; });
  z.querySelectorAll('[data-bc]').forEach(function(b){ b.onclick=function(){
    allerGL({compte:b.dataset.bc, domaine:BF.domaine, centre:BF.centre, tiers:BF.tiers, du:du, au:au, tri:'date+'}); }; });
  if(BF.domaine||BF.centre||BF.tiers){ z.querySelector('.glf').insertAdjacentHTML('afterend','<button class="plus-btn nonimp" id="balRaz">Effacer les filtres</button>');
    $('balRaz').onclick=function(){ BF.domaine=''; BF.centre=''; BF.tiers=''; dessinerSoldes(); }; }
  $('balImp').onclick=function(){ window.print(); };
}

function dessinerResume(z, bascule){
  var S=D.soldes||{}, A=D.annee||{}, an=new Date().getFullYear();
  function liste(titre, items, explication, total){
    var h='<h2>'+titre+'</h2>';
    if(!items.length) return h+'<div class="vide">Rien en cours.</div>';
    h+='<div class="tab">'+items.map(function(x){
      return '<div class="r'+(x.lien?' lien-l':'')+'" style="grid-template-columns:1fr auto"'+(x.lien?' data-lc="'+esc(x.nom)+'"':'')+'><span>'+esc(x.nom)+(x.lien?' ›':'')+'</span><span style="font-weight:700'+(x.rouge?';color:var(--rouge)':'')+'">'+mad(x.v)+'</span></div>';
    }).join('')+(total!==undefined?'<div class="r" style="grid-template-columns:1fr auto;font-weight:700"><span>Total</span><span>'+mad(total)+'</span></div>':'')+'</div>';
    if(explication) h+='<div class="note">'+explication+'</div>';
    return h;
  }
  var caisses=D.caisses.map(function(c){return {nom:c.nom, v:c.solde, rouge:c.solde<0};});
  var four=[], cli=[], av=[];
  D.tiers.forEach(function(c){
    var s=S[c.nom]||0; if(Math.abs(s)<0.005) return;
    if(c.groupe==='Client') cli.push({nom:c.nom, v:s, lien:true});
    else if(c.groupe==='Avance') av.push({nom:c.nom, v:s, lien:true});
    else four.push({nom:c.nom, v:-s, rouge:s<0, lien:true});
  });
  four.sort(function(a,b){return b.v-a.v;}); cli.sort(function(a,b){return b.v-a.v;}); av.sort(function(a,b){return Math.abs(b.v)-Math.abs(a.v);});
  var dep=D.charges.map(function(c){return {nom:c.nom, v:A[c.nom]||0};}).filter(function(x){return Math.abs(x.v)>0.005;}).sort(function(a,b){return b.v-a.v;});
  var rec=D.produits.map(function(c){return {nom:c.nom, v:-(A[c.nom]||0)};}).filter(function(x){return Math.abs(x.v)>0.005;}).sort(function(a,b){return b.v-a.v;});
  var som=function(l){return l.reduce(function(s,x){return s+x.v;},0);};
  var h=bascule;
  h+=liste('Caisses et banques', caisses, '', som(caisses));
  h+=liste('Fournisseurs — vous devez', four, 'Montant négatif = avance versée au fournisseur. Touchez un nom pour le lettrage.', som(four));
  h+=liste('Clients — on vous doit', cli, '', som(cli));
  h+=liste('Avances et personnes', av, 'Positif : la personne vous doit. Négatif : vous lui devez.', som(av));
  h+=liste('Dépenses '+an+' par centre de dépense', dep, '', som(dep));
  h+=liste('Recettes '+an+' par catégorie', rec, '', som(rec));
  h+='<div class="tab" style="margin-top:12px"><div class="r" style="grid-template-columns:1fr auto;font-weight:700;font-size:17px"><span>Résultat '+an+'</span><span style="color:'+(som(rec)-som(dep)<0?'var(--rouge)':'var(--vert2)')+'">'+mad(som(rec)-som(dep))+'</span></div></div>';
  z.innerHTML=h; brancherBascule(z);
  z.querySelectorAll('[data-lc]').forEach(function(b){ b.onclick=function(){ LCOMPTE=b.dataset.lc; LSEL={}; LVOIR='ouvertes'; vue('lettrage'); }; });
}
function fermer(id){ document.getElementById(id).className='ecran'; }

/* =========================================================
   Réglages
   ========================================================= */
function ouvrirReglages(){
  document.getElementById('r-url').value = CFG ? CFG.url : '';
  document.getElementById('r-cle').value = CFG ? CFG.cle : '';
  document.getElementById('r-info').textContent = FILE.length ? FILE.length+' opération(s) sont gardées dans ce téléphone.' : '';
  document.getElementById('btnFermerReglages').style.visibility = CFG ? 'visible' : 'hidden';
  document.getElementById('reglages').className='ecran on';
}
function testerConnexion(){
  var url=document.getElementById('r-url').value.trim(), cle=document.getElementById('r-cle').value;
  if(!/^https:\/\/script\.google(usercontent)?\.com\/.+/.test(url)) return toast('L\'adresse doit commencer par https://script.google.com/', true);
  if(!cle) return toast('Saisissez le code secret', true);
  var b=document.getElementById('btnTester'); b.disabled=true; b.textContent='Connexion…';
  var cfg={url:url, cle:cle};
  appelScript({action:'donnees'}, cfg).then(function(rep){
    b.disabled=false; b.textContent='Tester et enregistrer';
    if(!rep || !rep.ok) return toast((rep&&rep.erreur)||'Réponse inattendue', true);
    CFG=cfg; ecrire(CLE_CFG, CFG);
    CACHE=rep.donnees; CACHE.recuLe=new Date().toISOString(); ecrire(CLE_CACHE, CACHE);
    derniereErreur=''; calculer(); dessiner(); fermer('reglages');
    toast('Connecté à votre Google Sheet ✓');
    if(FILE.length) synchroniser(false);
  }).catch(function(e){
    b.disabled=false; b.textContent='Tester et enregistrer';
    toast('Connexion impossible. Vérifiez l\'adresse, le réseau et le déploiement « Tout le monde ».', true);
  });
}

/* =========================================================
   Démarrage
   ========================================================= */
window.addEventListener('online', function(){ derniereErreur=''; synchroniser(false); });
window.addEventListener('offline', function(){ derniereErreur='horsligne'; dessinerEtat(); });
document.addEventListener('visibilitychange', function(){ if(document.visibilityState==='visible') synchroniser(false); });
setInterval(function(){ if(FILE.some(function(o){return !o.erreur;})) synchroniser(false); }, 60000);

if('serviceWorker' in navigator && location.protocol!=='file:'){
  navigator.serviceWorker.register('sw.js').catch(function(){});
}

calculer(); dessiner();
if(!CFG) ouvrirReglages(); else synchroniser(false);
</script>
